{% extends 'base.html' %}

{% block content %}
<div class="card">
  <span class="badge">Smart Home Assistant</span>
  <span class="mic-icon">🎙️</span>
  <h1>Voice Assistant</h1>
  <p>
    Talk to your AI assistant to get personalised advice on how to optimise
    windows, shutters, air quality and brightness in any room of your house.
  </p>
  <button class="btn-primary" id="startRecordingBtn">
    Start Recording
  </button>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function () {
    var segment = {{ segment | tojson }};

    // Track recording_start_click when the button is clicked
    document.getElementById('startRecordingBtn').addEventListener('click', function () {
      fetch('/track/recording-start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ segment_id: segment })
      })
      .then(function () {
        window.location.href = '/recording';
      })
      .catch(function () {
        window.location.href = '/recording';
      });
    });
  })();
</script>
{% endblock %}
