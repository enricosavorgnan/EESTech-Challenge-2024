<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TIE Team – Smart Home Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #f0f0f0;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }

    nav .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: #a78bfa;
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 1.5rem;
    }

    nav ul li a {
      color: #d1d5db;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    nav ul li a:hover { color: #a78bfa; }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      min-height: calc(100vh - 65px);
    }

    .card {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 1.25rem;
      padding: 2.5rem 3rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .card h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #a78bfa;
    }

    .card p {
      font-size: 1rem;
      color: #c4c4c4;
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .btn-primary {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.85rem 2.5rem;
      background: linear-gradient(90deg, #7c3aed, #4f46e5);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 15px rgba(124,58,237,0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124,58,237,0.6);
    }

    .welcome-banner {
      background: linear-gradient(135deg, rgba(124,58,237,0.2), rgba(79,70,229,0.2));
      border: 1px solid rgba(124,58,237,0.4);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .welcome-banner h2 {
      font-size: 1.15rem;
      color: #c4b5fd;
      margin-bottom: 0.5rem;
    }

    .welcome-banner p {
      font-size: 0.9rem;
      color: #a5b4fc;
      margin: 0;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 1rem;
      background: rgba(167,139,250,0.15);
      color: #a78bfa;
      border: 1px solid rgba(167,139,250,0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
    th { color: #a78bfa; }

    .mic-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      display: block;
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand">🏠 TIE Smart Home</a>
    <ul>
      <li><a href="/">Assistant</a></li>
      <li><a href="/events">Events Log</a></li>
    </ul>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
